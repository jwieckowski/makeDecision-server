services:
  # ---------- Database ----------
  db:
    image: postgres:16-alpine
    container_name: makedecision-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-makedecision}
      POSTGRES_USER: ${POSTGRES_USER:-makedecision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-makedecision} -d ${POSTGRES_DB:-makedecision}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------- Redis (Celery broker + cache) ----------
  redis:
    image: redis:7-alpine
    container_name: makedecision-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Django API ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makedecision-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --reload"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-makedecision}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-makedecision}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------- Celery Worker ----------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makedecision-celery-worker
    restart: unless-stopped
    command: celery -A config.celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-makedecision}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-makedecision}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ---------- Celery Beat (scheduler) ----------
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: makedecision-celery-beat
    restart: unless-stopped
    command: celery -A config.celery beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-makedecision}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-makedecision}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
      celery_worker:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
